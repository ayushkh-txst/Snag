[project]
name = "snag"
version = "0.1.0"
description = "Paste a system prompt and tool definitions, and find out what breaks them."
requires-python = ">=3.12"
dependencies = [
    "substrate",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[project.scripts]
snag = "snag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snag"]

[tool.uv.sources]
substrate = { workspace = true }
