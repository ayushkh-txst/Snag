# Render Blueprint. `New -> Blueprint` in the Render dashboard, pointed at
# this repo, picks this up automatically.
services:
  - type: web
    name: snag
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ACCEPTED_MODELS
        sync: false
